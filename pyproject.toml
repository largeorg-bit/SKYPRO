[project]
name = "skypro"
version = "0.1.0"
description = ""
authors = [
    { name = "имя фамилия", email = "largeorgg@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
    /(
        \.git
    )/
)
'''

[tool.isort]
# максимальная длина строки
line_length = 119